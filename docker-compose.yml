version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: carwashoso-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - carwashoso-network
    environment:
      MONGO_INITDB_DATABASE: carwashoso

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carwashoso-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/carwashoso
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_use_long_random_string}
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    networks:
      - carwashoso-network
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carwashoso-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
    networks:
      - carwashoso-network

volumes:
  mongo_data:
  uploads_data:

networks:
  carwashoso-network:
    driver: bridge
